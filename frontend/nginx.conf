server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/apps/bishun/ 下的其他路径都返回 index.html。
    # index.html 每次都向服务器确认是否有新版本，升级模块后不用强制刷新。
    location /apps/bishun/ {
        add_header Cache-Control "no-cache";
        try_files $uri /apps/bishun/index.html;
    }

    location /apps/bishun/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
